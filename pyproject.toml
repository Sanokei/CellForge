[project]
name = "cellforge"
version = "0.1.0"
description = "LLM-authored neural construction without gradient fitting (CellForge OCR v3)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cellforge = "cellforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
